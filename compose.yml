services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    image: ${IMAGE_NAME}

  modeeb:
    image: mongo
    container_name: modeeb
    # NOTE You'll need this if accessing outside of a container
    #ports:
    #  - 127.0.0.1:27017:27017
    volumes:
      - ${MONGO_VOLUME}:/docker-entrypoint-initdb.d/seed.js:ro
    env_file: ${ENV_FILE}

  jmjanzen.com:
    image: ${IMAGE_NAME}
    ports:
      - 127.0.0.1:${COM_PORT}:${COM_PORT}
    env_file: ${ENV_FILE}
    entrypoint: /bin/server jmjanzen.com

  api.jmjanzen.com:
    image: ${IMAGE_NAME}
    depends_on:
      - modeeb
    ports:
      - 127.0.0.1:${API_PORT}:${API_PORT}
    env_file: ${ENV_FILE}
    entrypoint: /bin/server api.jmjanzen.com


  jmjanzen.cv:
    image: ${IMAGE_NAME}
    ports:
      - 127.0.0.1:${CV_PORT}:${CV_PORT}
    env_file: ${ENV_FILE}
    entrypoint: /bin/server jmjanzen.cv

  blog.jmjanzen.com:
    image: ${IMAGE_NAME}
    ports:
      - 127.0.0.1:${BLOG_PORT}:${BLOG_PORT}
    env_file: ${ENV_FILE}
    entrypoint: /bin/server blog.jmjanzen.com
